name: Program and release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compositor dependencies
        run: python -m pip install Pillow==11.3.0 numpy==2.0.2
      - name: Test preservation, replay and bounded repairs
        run: python -m unittest discover -s tests -v
      - name: Check release materials
        run: python scripts/check_release.py
      - name: Check publication privacy
        run: python scripts/check_privacy.py
      - name: Build and verify ZIP packages
        run: python scripts/package.py
